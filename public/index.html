<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harness session lifecycle spike</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>Harness session lifecycle spike</h1>
      <dl>
        <div>
          <dt>Session</dt>
          <dd id="session-id">None</dd>
        </div>
        <div>
          <dt>Attachment</dt>
          <dd id="attachment">Detached</dd>
        </div>
      </dl>
      <div class="controls">
        <button id="create" type="button">Create session</button>
        <button id="attach" type="button" disabled>Attach</button>
        <button id="disconnect" type="button" disabled>Disconnect</button>
        <button id="stop" type="button" disabled>Stop session</button>
      </div>
      <pre id="output" aria-label="Terminal output"></pre>
      <form id="command-form">
        <label for="command">Bash command</label>
        <div class="command-row">
          <input id="command" name="command" autocomplete="off" disabled />
          <button type="submit" disabled>Send</button>
        </div>
      </form>
    </main>
    <script src="/client.js"></script>
  </body>
</html>
