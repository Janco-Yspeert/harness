name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    # Containment is an Ubuntu-host contract. Keep this on the supported LTS
    # rather than letting ubuntu-latest silently change namespace behaviour.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Spike 012's bootstrap provenance validator verifies the pinned
          # evaluator source object, which is intentionally older than HEAD.
          # The default depth-one checkout cannot contain that object.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          npm ci

      - name: Enable Bubblewrap's scoped AppArmor profile
        # Ubuntu 24.04 restricts unprivileged user namespaces by default.
        # This exact profile only applies to /usr/bin/bwrap on this ephemeral
        # runner; it does not relax the global AppArmor user-namespace
        # restriction. Ubuntu's apparmor-profiles bwrap-userns-restrict profile
        # cannot initialize Bubblewrap's required mount namespace because it
        # denies CAP_SYS_ADMIN to Bubblewrap's stacked child label.
        run: |
          profile=.github/ci/harness-bwrap-userns
          test -r "$profile"
          sudo apparmor_parser --replace "$profile"
          sudo aa-status
          sudo grep -E '^harness-bwrap-userns ' /sys/kernel/security/apparmor/profiles

      - name: Verify containment prerequisites
        run: |
          report_containment_failure() {
            status=$1
            echo "Bubblewrap containment preflight failed (exit $status)." >&2
            echo "=== User-namespace kernel settings ===" >&2
            for setting in \
              /proc/sys/kernel/apparmor_restrict_unprivileged_userns \
              /proc/sys/kernel/unprivileged_userns_clone \
              /proc/sys/user/max_user_namespaces; do
              if test -r "$setting"; then
                printf '%s=' "$setting" >&2
                cat "$setting" >&2
              fi
            done
            echo "=== Direct unprivileged user-namespace probe ===" >&2
            if unshare --user --map-root-user -- true; then
              echo "unshare --user succeeded" >&2
            else
              echo "unshare --user failed" >&2
            fi
            echo "=== AppArmor profile status ===" >&2
            sudo aa-status >&2 || true
            echo "=== AppArmor kernel audit records ===" >&2
            sudo journalctl -k -b --no-pager | \
              grep -Ei 'apparmor|DENIED|userns|bwrap' | tail -n 200 >&2 || true
            exit "$status"
          }

          command -v bwrap
          bwrap --version
          bwrap --unshare-user --unshare-pid --die-with-parent --ro-bind / / true || \
            report_containment_failure $?
          bwrap --unshare-user --unshare-pid --die-with-parent --ro-bind / / \
            bwrap --unshare-user --unshare-pid --die-with-parent --ro-bind / / true || \
            report_containment_failure $?

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # These tests create real Git repositories, hosts and nested bubblewrap
      # namespaces. Serial files keep cleanup deterministic and leave a useful
      # failure summary instead of a cancelled, interleaved test swarm.
      - name: Run tests
        run: bash tools/ci-test-files.sh
