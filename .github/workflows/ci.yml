name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    # GitHub-hosted Ubuntu runs provider-free deterministic tests. Real
    # containment has an explicit local command because it requires host
    # namespace capabilities that hosted runners do not provide reliably.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Spike 012's bootstrap provenance validator verifies the pinned
          # evaluator source object, which is intentionally older than HEAD.
          # The default depth-one checkout cannot contain that object.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Serial files keep cleanup deterministic and leave a useful failure
      # summary. Containment files are explicitly reported as local-only skips.
      - name: Run deterministic tests
        run: npm run test:ordinary
