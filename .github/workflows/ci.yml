name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    # Containment is an Ubuntu-host contract. Keep this on the supported LTS
    # rather than letting ubuntu-latest silently change namespace behaviour.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Spike 012's bootstrap provenance validator verifies the pinned
          # evaluator source object, which is intentionally older than HEAD.
          # The default depth-one checkout cannot contain that object.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          npm ci

      - name: Verify containment prerequisites
        run: |
          command -v bwrap
          bwrap --version
          bwrap --unshare-user --unshare-pid --die-with-parent --ro-bind / / true
          bwrap --unshare-user --unshare-pid --die-with-parent --ro-bind / / \
            bwrap --unshare-user --unshare-pid --die-with-parent --ro-bind / / true

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # These tests create real Git repositories, hosts and nested bubblewrap
      # namespaces. Serial files keep cleanup deterministic and leave a useful
      # failure summary instead of a cancelled, interleaved test swarm.
      - name: Run tests
        run: bash tools/ci-test-files.sh
