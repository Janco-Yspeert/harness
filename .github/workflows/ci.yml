name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    # Provider-free deterministic tests remain mandatory on GitHub-hosted
    # Ubuntu. Real containment runs in the separate Containment job.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Spike 012's bootstrap provenance validator verifies the pinned
          # evaluator source object, which is intentionally older than HEAD.
          # The default depth-one checkout cannot contain that object.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Serial files keep cleanup deterministic and leave a useful failure
      # summary. The hosted job runs every provider-free deterministic file;
      # the runner prints each containment file as an explicit SKIP and the
      # separate Containment job makes them required on a capable host.
      - name: Run deterministic tests
        run: bash tools/ci-test-files.sh ordinary

  containment:
    name: Containment
    # GitHub-hosted Ubuntu runners allow the bwrap AppArmor profile to load but
    # make uid_map read-only. This runner must be dedicated to Harness, provide
    # bwrap and a scoped profile that permits its nested user namespaces, and
    # retain the global AppArmor user-namespace restriction.
    runs-on: [self-hosted, linux, x64, harness-containment]
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify containment prerequisites
        run: |
          command -v bwrap
          bwrap --version
          bwrap --unshare-user --unshare-pid --die-with-parent --ro-bind / / true
          bwrap --unshare-user --unshare-pid --die-with-parent --ro-bind / / \
            bwrap --unshare-user --unshare-pid --die-with-parent --ro-bind / / true

      - name: Run containment tests
        run: bash tools/ci-test-files.sh containment
